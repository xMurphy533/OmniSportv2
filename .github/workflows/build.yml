name: Build Omnisport

on:
  pull_request:
    branches:
      - main

  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - name: Pobranie kodu
          uses: actions/checkout@v3

        - name: Konfiguracja Java 17
          uses: actions/setup-java@v3
          with:
            java-version: '17'
            distribution: 'temurin'
            cache: maven

        - name: Nadanie uprawnień do mvnv
          working-directory: ./api
          run: chmod +x mvnw

        - name: Kompilacja i uruchomienie testów
          working-directory: ./api
          run: ./mvnw clean test