name: Build Omnisport

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        # TEN BLOK JEST WYMAGANY PRZEZ KONTENER POSTGRESQL:
        env:
          POSTGRES_DB: omnisport
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v3

      - name: Konfiguracja Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Nadanie uprawnień do mvnw
        working-directory: ./api
        run: chmod +x mvnw

      - name: Kompilacja i uruchomienie testów
        working-directory: ./api
        run: >
          ./mvnw clean test 
          -Dspring.profiles.active=test 
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/omnisport 
          -Dspring.datasource.username=postgres 
          -Dspring.datasource.password=password
          -Dspring.flyway.url=jdbc:postgresql://localhost:5432/omnisport
          -Dspring.flyway.user=postgres
          -Dspring.flyway.password=password