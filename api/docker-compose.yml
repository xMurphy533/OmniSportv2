services:
  postgres:
    image: postgres:15-alpine
    container_name: omnisport-postgres
    environment:
      POSTGRES_DB: omnisport
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - omnisport-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnisport-api
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/omnisport
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: secretpassword
      SPRING_PROFILES_ACTIVE: dev
    networks:
      - omnisport-network

volumes:
  pgdata:

networks:
  omnisport-network:
    driver: bridge